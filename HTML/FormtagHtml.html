<!DOCTYPE html>
<html>
<body style="background-color: lightblue;">
<h2>Text input fields</h2>
<style>
</style>
<form action="D:\HTMLBesant\HtmlTableExampleNew.html" 
autocomplete="on">
  <label for="fname">First name:</label>
  <input type="text" id="fname" name="fname" required>
  <br>
  <label for="lname">Last name:</label>
  <input type="text" id="lname" name="lname" value="Sameer" readonly >

  <br><br>
  <label for="pin">PIN:</label><br>
  <input type="text" id="pin" name="pin" maxlength="6" size="5"><br>
  <br>

  <label for="phone">Enter a tele phone number:</label>
  <input type="tel" id="phone" name="phone" placeholder="123-45-678" pattern="[0-9]{3}-[0-9]{2}-[0-9]{3}"><br><br> 

  <label for="password">Password:</label>
  <input type="password" id="password" name="password" maxlength="10" required>

  <p>Choose your favorite Web language:</p>
 <input type="radio" id="html" name="fav_language" value="html">
 <label for="html">HTML</label>

 <input type="radio" id="css" name="fav_language" value="CSS">
 <label for="css">CSS</label>

 <input type="radio" id="javascript" name="fav_language" value="JavaScript">

 <label for="javascript">JavaScript</label>
 <br><br>

 <input type="checkbox" id="vehicle1" name="vehicle" value="Bike">
  <label for="vehicle1"> I have a bike</label><br>
  <input type="checkbox" id="vehicle2" name="vehicle" value="Car">
  <label for="vehicle2"> I have a car</label><br>

  <input type="checkbox" id="vehicle3" name="vehicle" value="Boat">
  <label for="vehicle3"> I have a boat</label><br><br>

  <br><br>
  <label for="cars">Choose a car:</label>
  <select id="cars" name="cars">
     <option value="Carselect">Select a Car</option>
    <option value="volvo" >Volvo</option>
    <option value="saab">Saab</option>
    <option value="fiat">Fiat</option>
    <option value="audi" disabled>Audi</option>
    <option value="Suzuki">SUZUKI</option>
  </select> 
  
  <label for="birthday">Birthday:</label>
  <input type="date" id="birthday" name="birthday">

   <label for="datemin">Enter a date after 2000-01-01:</label>
  <input type="date" id="datemin" name="datemin" min="2000-01-02"><br><br>

  <label for="datemax">Enter a date before 1980-01-01:</label>
  <input type="date" id="datemax" name="datemax" max="2024-01-01"><br><br>

  <label for="email">Enter your email:</label>
  <input type="email" id="email" name="email" required>
  <br><br>

  <label for="password">Enter your password:</label>
  <input type="password" id="pwd" name="password">
  <br>

  <label for="myfile">Select a file:</label>

  <input type="file" id="myfile" name="myfile"><br><br>

  <input type="color" id="favcolor" name="favcolor" value="red">
  
  <input type="submit" value="submit">
  <input type="reset">
</form>
</body>
</html>
