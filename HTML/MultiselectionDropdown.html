<!DOCTYPE html>
<html>
<body>
<h2>Allow Multiple Selections</h2>
<p>Use the multiple attribute to allow the user to select more than one value.</p>
<form action="\D:\HTMLBesant\formtagHtml.html">
  <label for="cars">Choose a car:</label>
  <select id="cars" name="cars" size="5" multiple>
    <option value="volvo">Volvo</option>
    <option value="saab">Saab</option>
    <option value="fiat">Fiat</option>
    <option value="audi">Audi</option>
    <option value="bmw">BMW</option>
    <option value="audi">Tata</option>
    <option value="bmw">Maruti</option>
       <option value="audi">Hundai</option>
    <option value="bmw">Kia</option>
  </select><br><br>
  
  <textarea name="message" style="width:60%; height:5rem;"></textarea>
  <br><br>
  
  <input list="courses" name="courses">
  <datalist id="courses">
    <option value="html">
    <option value="css">
    <option value="js">
    <option value="React"> 
    <option value="sql">
  </datalist>
  <br></br>
  <input type="submit">
</form>
</body>
</html>
